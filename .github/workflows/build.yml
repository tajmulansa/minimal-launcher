name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK. Accept its licenses so Gradle
      # can download any missing platform (for example API 36).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub web UI can lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK, run unit tests and lint
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Show the compiler errors as a readable annotation on the run summary page.
            msg=$(grep -E "^e: |error:|Execution failed|What went wrong|FAILED" -A2 build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          exit $code

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
