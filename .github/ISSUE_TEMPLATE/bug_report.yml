name: Bug report
description: Something is broken or behaves in a surprising way
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the launcher
        2. Tap "all apps"
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Example: Pixel 7, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Shown in the build artifact name or the latest commit hash.
